<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Predicció meteorològica</title>

    <link rel="stylesheet" href="weather-icons/css/weather-icons.min.css">
    <link rel="stylesheet" href="meteocat.css">
</head>

<body>

<div class="weather-widget">

    <div class="widget-header">
        <div class="widget-source">
            Meteocat
        </div>
    </div>


    <div class="forecast" id="forecast-container">
        <!-- El contingut es carregarà dinàmicament des de forecast.json -->
    </div>


    <div class="widget-footer">
        <span id="updated-at">Actualitzat avui a les 08:00</span>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const forecastContainer = document.getElementById("forecast-container");
        const locationElement = document.getElementById("widget-location");
        const updatedAtElement = document.getElementById("updated-at");

        fetch("forecast.json")
            .then(response => {
                if (!response.ok) throw new Error("No s'ha pogut carregar la predicció.");
                return response.json();
            })
            .then(data => {
                if (data.location && locationElement) {
                    locationElement.textContent = data.location;
                }
                if (data.updatedAt && updatedAtElement) {
                    updatedAtElement.textContent = data.updatedAt;
                }
                
                if (data.forecast && forecastContainer) {
                    forecastContainer.innerHTML = data.forecast.map(item => `
                        <article class="day-card${item.dayName === 'AVUI' ? ' today' : ''}">
                            <div class="day-name">${item.dayName}</div>
                            <div class="date">${item.date}</div>
                            <div class="weather-icon"><i class="wi ${item.iconClass}"></i></div>
                            <div class="temperature">
                                <span class="max">${item.maxTemp}°</span>
                                <span class="min">${item.minTemp}°</span>
                            </div>
                            <div class="description">${item.description}</div>
                            <div class="rain">
                                <i class="wi wi-raindrop"></i> ${item.rainPercent}%
                            </div>
                        </article>
                    `).join("");
                }
            })
            .catch(error => {
                console.error(error);
                if (forecastContainer) {
                    forecastContainer.innerHTML = `
                        <div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: #71808c; font-size: 14px; width: 100%;">
                            <i class="wi wi-rain-mix" style="font-size: 32px; display: block; margin-bottom: 10px; color: #e74c3c;"></i>
                            No s'ha pogut carregar la previsió meteorològica en aquest moment.
                        </div>
                    `;
                }
            });
    });
</script>

</body>
</html>
